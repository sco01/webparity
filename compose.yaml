# SPDX-License-Identifier: BSD-2-Clause
# webparity: the browsers, the recording proxy and the worker. All services share the reference container's network
# namespace (and PID namespace, so the worker can measure the browsers' CPU), so they reach each other on 127.0.0.1
# and nothing is exposed outside except the web interface, which listens on 127.0.0.1 of the host.
#
#   cp config.example.yaml data/config.yaml        # then edit
#   LADYBIRD_BUILD=/path/to/Build/release docker compose up -d --build
#
# One project is one visit at a time. For parallel visits run several projects on the same data directory:
#   docker compose -p webparity-2 up -d reference ladybird proxy worker
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  restart: unless-stopped

services:
  reference:
    build:
      context: images
      dockerfile: reference/Dockerfile
    shm_size: 2gb
    cpu_shares: 256
    mem_limit: 8g
    environment:
      WEBPARITY_PROXY: ${WEBPARITY_PROXY:-127.0.0.1:8790}
    # Chromium's sandbox needs user namespaces, which Docker's default seccomp and AppArmor profiles block. The container
    # runs without them, but with no capabilities and no-new-privileges; Chromium and Firefox keep their own sandboxes,
    # which are what protects against the sites' content.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - /etc/localtime:/etc/localtime:ro  # quiet hours and timestamps in the host's local time
      - proxy-ca:/etc/webparity:ro
    ports:
      - "127.0.0.1:${WEBPARITY_WEB_PORT:-8700}:8700"
    restart: unless-stopped

  proxy:
    <<: *hardening
    build:
      context: images
      dockerfile: proxy/Dockerfile
    network_mode: "service:reference"
    depends_on: [reference]
    volumes:
      - /etc/localtime:/etc/localtime:ro  # quiet hours and timestamps in the host's local time
      - proxy-conf:/home/webparity/.mitmproxy
      - proxy-ca:/export
      - ${WEBPARITY_DATA:-./data}/recordings:/data/recordings

  ladybird:
    <<: *hardening
    build:
      context: images
      dockerfile: ladybird/Dockerfile
      args:
        # The tag in Meta/Docker/ci/VERSION of the Ladybird checkout the build came from
        LADYBIRD_CI_TAG: ${LADYBIRD_CI_TAG:-2026.11.20}
    network_mode: "service:reference"
    pid: "service:reference"
    depends_on: [reference, proxy]
    shm_size: 2gb
    # Browsers get a low CPU weight, so a nightly build on the same host wins, and a memory limit, so a runaway page
    # kills a WebContent process instead of the host.
    cpu_shares: 256
    mem_limit: 12g
    environment:
      WEBPARITY_PROXY: ${WEBPARITY_PROXY:-127.0.0.1:8790}
    volumes:
      - /etc/localtime:/etc/localtime:ro  # quiet hours and timestamps in the host's local time
      # Mounted at /src/Build/release, the path Ladybird's CI image builds at (the binaries use an absolute RUNPATH).
      - ${LADYBIRD_BUILD:?set LADYBIRD_BUILD to a Ladybird Build/release directory}:/src/Build/release:ro
      - proxy-ca:/etc/webparity:ro
      - ladybird-run:/run/webparity/ladybird

  worker:
    <<: *hardening
    build:
      context: .
      dockerfile: images/worker/Dockerfile
    network_mode: "service:reference"
    pid: "service:reference"
    depends_on: [reference, ladybird, proxy]
    command: ["worker"]
    stop_grace_period: 2m  # finish the visit, so Ladybird's single WebDriver session is ended
    environment:
      WEBPARITY_CONFIG: /data/config.yaml
    volumes:
      - /etc/localtime:/etc/localtime:ro  # quiet hours and timestamps in the host's local time
      - ${WEBPARITY_DATA:-./data}:/data
      - proxy-ca:/etc/webparity:ro
      - ladybird-run:/run/webparity/ladybird:ro
      # The Ladybird checkout (read-only, for "is this fix in the build"), or only the build when not set
      - ${LADYBIRD_SOURCE:-${LADYBIRD_BUILD}/../..}:/src:ro

  web:
    <<: *hardening
    build:
      context: .
      dockerfile: images/worker/Dockerfile
    network_mode: "service:reference"
    depends_on: [reference]
    command: ["web", "--listen", "0.0.0.0:8700"]
    environment:
      WEBPARITY_CONFIG: /data/config.yaml
    volumes:
      - /etc/localtime:/etc/localtime:ro  # quiet hours and timestamps in the host's local time
      - ${WEBPARITY_DATA:-./data}:/data

  alerts:
    <<: *hardening
    build:
      context: .
      dockerfile: images/worker/Dockerfile
    network_mode: "service:reference"
    depends_on: [reference]
    command: ["alerts"]
    environment:
      WEBPARITY_CONFIG: /data/config.yaml
    volumes:
      - /etc/localtime:/etc/localtime:ro  # quiet hours and timestamps in the host's local time
      - ${WEBPARITY_DATA:-./data}:/data

volumes:
  proxy-conf:
  proxy-ca:
  ladybird-run:
