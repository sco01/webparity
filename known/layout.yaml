- id: flex-container-intrinsic-width-ignores-img-max-height
  issue: "#14252"
  fixed: "5f19d6f289"
  text: "the flex container's intrinsic width ignores the image item's max-height (Teamtailor's logo link)"
  prefix: ["layout:width:flex>", "layout:position:flex>", "mobile-layout:width:flex>", "mobile-layout:position:flex>"]
  js: |
    // An image with max-height that is a flex item in a flex container that (in the reference browser) is as wide as the
    // image, while the image's natural width is larger – in Ladybird the container becomes as wide as the natural width (2026-11-10)
    for (const i of document.images) {
      const p = i.parentElement; if (!p || !i.naturalWidth) continue;
      const pc = getComputedStyle(p), ic = getComputedStyle(i);
      if (!/flex/.test(pc.display) || ic.maxHeight === 'none' || ic.position === 'absolute') continue;
      const iw = i.getBoundingClientRect().width, pw = p.getBoundingClientRect().width;
      if (!(iw > 0 && i.naturalWidth > iw + 10 && Math.abs(pw - iw) <= 2 + parseFloat(pc.paddingLeft) + parseFloat(pc.paddingRight))) continue;
      // The container's width must depend on the image: without max-height it should grow (otherwise a definite width – no effect)
      const previous = i.style.maxHeight; i.style.maxHeight = 'none'; const pw2 = p.getBoundingClientRect().width; i.style.maxHeight = previous;
      if (pw2 > pw + 10) return (p.className || p.tagName).toString().slice(0, 40) + ' ' + Math.round(iw) + '/' + i.naturalWidth + ' grows to ' + Math.round(pw2);
    }
    return false;

# Mobile view (2026-11-10): the tests run in the reference browser after the visit (desktop width) and look for the
# pattern, not for the overflow.
- id: abspos-auto-insets-shrink-against-container-width
  issue: "#14231"
  fixed: "5f19d6f289"
  text: "abspos with left/right/width auto shrinks against the whole container width, not from the static position (Abou e-services)"
  prefix: ["mobile-overflow", "mobile-layout:"]
  js: |
    const M = 390;
    for (const e of document.querySelectorAll('body *')) {
      const c = getComputedStyle(e); if (c.position !== 'absolute' || !e.parentElement || !e.textContent.trim()) continue;
      let m; try { m = e.computedStyleMap(); } catch (x) { continue; }
      if (String(m.get('left')) !== 'auto' || String(m.get('right')) !== 'auto' || String(m.get('width')) !== 'auto') continue;
      const ta = getComputedStyle(e.parentElement).textAlign;
      const w = e.getBoundingClientRect().width;
      if ((/center/.test(ta) && w > M / 2) || (/right|end/.test(ta) && w > 20)) return (e.id || e.tagName) + ' ' + ta + ' ' + Math.round(w);
    }
    return false;

- id: transformed-block-in-inline-untransformed-overflow
  issue: "#14233"
  fixed: "f3aaffc797"
  text: "a transformed block in an inline element counts in scrollable overflow at its untransformed position (a newspaper group's sites)"
  prefix: ["mobile-overflow", "overflow"]
  js: |
    // The transform may be in a media query for mobile width: rules with translate, also inside @media
    const sel = []; const walk = rr => { for (const r of rr) { try {
      if (r.selectorText && r.style && /translate/.test(r.style.transform || '')) sel.push(r.selectorText);
      if (r.cssRules) walk(r.cssRules); } catch (x) {} } };
    for (const s of document.styleSheets) { try { walk(s.cssRules); } catch (x) {} }
    for (const e of document.querySelectorAll('body *')) {
      if (getComputedStyle(e).display !== 'inline') continue;
      for (const b of e.children) { const c = getComputedStyle(b);
        if (!/^(block|flex|grid|flow-root|table)$/.test(c.display)) continue;
        if (c.transform !== 'none' && Math.abs(new DOMMatrix(c.transform).m41) >= 20) return e.tagName.toLowerCase() + ' > ' + b.tagName.toLowerCase();
        const t = sel.find(x => { try { return b.matches(x); } catch (y) { return false; } });
        if (t) return e.tagName.toLowerCase() + ' > ' + b.tagName.toLowerCase() + ' (' + t.slice(0, 60) + ')'; }
    }
    return false;

# 2026-11-23: justify-self on a block-level box in a block container (CSS Box Alignment 3) shrinks the box to fit its
# content and aligns it in Chromium; Ladybird and Firefox ignore it there, so the box stays as wide as its container (two
# sites with the same theme: footer menu links with justify-self: start, no visible difference). Runs in the reference
# browser: a block-level box in a block container with a non-default justify-self that is narrower than its container.
- id: justify-self-in-block-layout
  issue: "missing-feature:justify-self-block"
  text: "justify-self on block-level boxes in block layout (Chromium only; Ladybird and Firefox ignore it)"
  prefix: ["layout:width:", "mobile-layout:width:"]
  js: |
    for (const e of document.querySelectorAll('body *')) {
      const s = getComputedStyle(e);
      if (!/^(start|end|center|left|right|self-start|self-end|flex-start|flex-end)$/.test(s.justifySelf)) continue;
      if (!/^(block|flex|grid|table|flow-root|list-item)$/.test(s.display) || s.float !== 'none' || /absolute|fixed/.test(s.position)) continue;
      const p = e.parentElement; if (!p || !/^(block|list-item|flow-root)$/.test(getComputedStyle(p).display)) continue;
      const w = e.getBoundingClientRect().width, pw = p.clientWidth;
      if (w > 0 && w < pw - 2) return 'justify-self: ' + s.justifySelf + ' on ' + (e.classList[0] || e.tagName.toLowerCase());
    }
    return false;

# 2026-11-23: an empty block's collapsed-through margin is lost when it can't collapse out of a parent with padding or a
# border at both the top and the bottom (parkasol.se: a footer 30 px shorter). Runs in the reference browser: a block
# (not a formatting context root) with top and bottom padding or border whose in-flow content is only empty blocks, at
# least one of them with a vertical margin.
- id: empty-block-margin-in-padded-parent
  issue: "#15396"
  text: "the collapsed-through margin of an empty block is lost inside a parent with top and bottom padding (#15396)"
  prefix: ["layout:height:", "mobile-layout:height:"]
  js: |
    const px = v => parseFloat(v) || 0;
    const inFlow = e => { const s = getComputedStyle(e); return s.display !== 'none' && s.float === 'none' && !/absolute|fixed/.test(s.position); };
    // An empty block that margins collapse through, with the largest vertical margin inside it (or -1 when it isn't one)
    const through = e => { const s = getComputedStyle(e);
      if (!/^(block|list-item)$/.test(s.display) || s.overflow !== 'visible' || e.getBoundingClientRect().height > 0.5) return -1;
      if (px(s.paddingTop) + px(s.paddingBottom) + px(s.borderTopWidth) + px(s.borderBottomWidth) > 0 || e.textContent.trim()) return -1;
      let m = Math.max(Math.abs(px(s.marginTop)), Math.abs(px(s.marginBottom)));
      for (const c of e.children) { if (!inFlow(c)) continue; const cm = through(c); if (cm < 0) return -1; m = Math.max(m, cm); }
      return m; };
    for (const e of document.querySelectorAll('body *')) {
      const s = getComputedStyle(e);
      if (!/^(block|list-item)$/.test(s.display) || s.overflow !== 'visible' || s.float !== 'none' || /absolute|fixed/.test(s.position)) continue;
      if (px(s.paddingTop) + px(s.borderTopWidth) <= 0 || px(s.paddingBottom) + px(s.borderBottomWidth) <= 0) continue;
      const kids = [...e.children].filter(inFlow); if (!kids.length || e.textContent.trim()) continue;
      let m = 0, ok = true; for (const c of kids) { const cm = through(c); if (cm < 0) { ok = false; break; } m = Math.max(m, cm); }
      if (ok && m >= 8) return 'empty block with a ' + m + 'px margin in ' + (e.classList[0] || e.tagName.toLowerCase());
    }
    return false;

# 2026-11-23: CSS Syntax: inside a block (@layer, @media, a style rule), a rule whose prelude has a semicolon ends at
# the semicolon and parsing goes on after it ("consume a block's contents" uses <semicolon-token> as the stop token).
# Ladybird does this; Chromium and Firefox drop the whole rule. WordPress custom CSS stored with ">" escaped as "&gt;"
# inside @layer theme { ... } on helsingborgskonsthall.se: ".card &gt; * { flex-shrink: 0 }" became "* { flex-shrink:
# 0 }" in Ladybird only. Runs in the reference browser: an inline style sheet with "&gt;" inside a block.
- id: semicolon-ends-rule-in-block
  issue: "known:semicolon-ends-rule-in-block"
  text: "a semicolon ends an invalid rule inside a block, so the text after it becomes a rule (CSS Syntax; Ladybird only)"
  prefix: ["layout:", "mobile-layout:"]
  js: |
    for (const s of document.querySelectorAll('style')) {
      const t = s.textContent; if (!t.includes('&gt;') && !t.includes('&lt;')) continue;
      let depth = 0;
      for (let i = 0; i < t.length; i++) {
        const ch = t[i];
        if (ch === '{') depth++;
        else if (ch === '}') depth = Math.max(0, depth - 1);
        else if (ch === '&' && depth >= 1 && /^&(gt|lt);/.test(t.slice(i, i + 4))) return 'escaped selector in a block: ' + t.slice(Math.max(0, i - 40), i + 8).replace(/\s+/g, ' ');
      }
    }
    return false;

