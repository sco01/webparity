# Known bug patterns in layout: block, inline, float, flex, table and positioned layout, images and missing content.

- id: comment-after-html-css-table
  issue: "#14116"
  fixed: "8ffb819f5c4"
  text: "a comment after </html> and a CSS table (WP Super Cache, LiteSpeed Cache)"
  prefix: ["layout:", "image-differs", "zero-size-text", "crash:formatting_context.rs", "mobile-layout:"]
  js: |
    let k = false; for (let n = document.documentElement.nextSibling; n; n = n.nextSibling) if (n.nodeType === 8) k = true;
    if (!k) return false;
    return Array.from(document.querySelectorAll('body *')).slice(0, 6000).some(e => /^(table|inline-table|table-row|table-cell|table-row-group)$/.test(getComputedStyle(e).display)
      && !/^(TABLE|TR|TD|TH|TBODY|THEAD|TFOOT|CAPTION|COLGROUP|COL)$/.test(e.tagName));

# Runs in Ladybird because Chromium computes position: absolute for a modal dialog.
- id: modal-dialog-relative-or-static-in-top-layer
  issue: "#14114"
  fixed: "9298770aa41"
  text: "a modal dialog with position relative/static in the top layer"
  prefix: ["layout:", "image-differs", "cookie-banner", "less-content"]
  run_in: ladybird
  js: |
    const roots = [document]; for (const e of document.querySelectorAll('*')) if (e.shadowRoot) roots.push(e.shadowRoot);
    for (const r of roots) for (const d of r.querySelectorAll('dialog')) { try { if (d.matches(':modal')) { const p = getComputedStyle(d).position;
      if (p !== 'absolute' && p !== 'fixed') return true; } } catch (e) {} }
    return false;

# 2026-11-14: a floating tbody/thead/tfoot makes the whole table's content disappear in Ladybird (a site's login page).
# Runs in the reference browser: a visible row group with float.
- id: floating-tbody-hides-table-content
  issue: "#14678"
  text: "a floating <tbody> → the table's content is not painted"
  prefix: ["layout:", "mobile-layout:", "image-differs", "less-content", "shorter-page", "zero-size-text", "overflow"]
  js: |
    for (const e of document.querySelectorAll('tbody, thead, tfoot')) {
      if (getComputedStyle(e).float === 'none') continue;
      const r = e.getBoundingClientRect(); if (r.width > 0 && r.height > 0) return 'floating ' + e.tagName.toLowerCase();
    }
    return false;

# 2026-11-14: clear gives no clearance past a float whose parent ends with a clearfix, when a negative margin-top pulls the
# clearing block up beside the float (a site: the cards). Runs in the reference browser: a block with clear and a negative
# margin-top whose previous sibling has a clearfix ::after and a floating child.
- id: clear-negative-margin-after-clearfix-parent
  issue: "#14679"
  fixed: "eee664d088b"
  text: "clear without clearance past a float in a clearfix parent with a negative margin-top"
  prefix: ["layout:", "mobile-layout:", "image-differs", "less-content", "shorter-page", "overflow"]
  js: |
    for (const e of document.querySelectorAll('body *')) {
      const s = getComputedStyle(e);
      if (s.clear === 'none' || !(parseFloat(s.marginTop) < 0) || s.float !== 'none') continue;
      let f = e.previousElementSibling; while (f && /absolute|fixed/.test(getComputedStyle(f).position)) f = f.previousElementSibling;
      if (!f) continue;
      const a = getComputedStyle(f, '::after');
      if (a.content === 'none' || a.clear === 'none') continue;
      if (![...f.children].some(c => getComputedStyle(c).float !== 'none' && c.getBoundingClientRect().height > 0)) continue;
      if (e.getBoundingClientRect().height > 0) return 'clear with negative margin after clearfix ' + (e.classList[0] || e.tagName.toLowerCase());
    }
    return false;

# 2026-11-14: an image without a natural size (an SVG with only a viewBox) that is limited by max-height keeps its full
# width in Ladybird (a site's payment logos). Runs in Ladybird (the reference browser cannot reliably tell a viewBox-only
# SVG from an SVG with its own size – one site gave a false match): an SVG image limited by max-height that fills the
# parent's whole width, or (2026-11-15) is wider than max-height × the aspect ratio.
- id: svg-viewbox-image-max-height-keeps-width
  issue: "#14681"
  text: "an SVG image (viewBox only) with max-height keeps its full width"
  prefix: ["layout:", "mobile-layout:", "image-differs", "less-content", "shorter-page", "overflow"]
  run_in: ladybird
  js: |
    for (const i of document.images) {
      const src = i.currentSrc || i.src || '';
      if (!/\.svg(\?|#|$)|^data:image\/svg/i.test(src)) continue;
      const s = getComputedStyle(i), mh = parseFloat(s.maxHeight); if (!(mh > 0)) continue;
      const r = i.getBoundingClientRect(); if (!(r.width > 0) || Math.abs(r.height - mh) > 1) continue;
      const p = i.parentElement; if (!p) continue;
      const ps = getComputedStyle(p), pin = p.getBoundingClientRect().width - parseFloat(ps.paddingLeft) - parseFloat(ps.paddingRight);
      if (r.width >= pin * 0.95 && r.width > r.height * 4) return 'svg max-height ' + Math.round(r.width) + '×' + Math.round(r.height) + ' (full width)';
      // 2026-11-15: the width is limited by something other than the parent (max-width, the default width 300, a float) –
      // compare with max-height × the aspect ratio (several sites, Sitevision logos)
      if (i.naturalWidth > 0 && i.naturalHeight > 0 && r.width > mh * i.naturalWidth / i.naturalHeight + 3)
        return 'svg max-height ' + Math.round(r.width) + '×' + Math.round(r.height) + ' (expected ' + Math.round(mh * i.naturalWidth / i.naturalHeight) + ' wide)';
    }
    return false;

# 2026-11-15: an <html> element that is not the document root makes Ladybird paint the body background over the whole
# page – a car maker's consent dialog (epaas-consent-drawer-shell, a shadow root with its own html/body) left several of
# its sites white. Runs in the reference browser: an html element besides the root, also in open shadow roots.
- id: html-element-besides-root-paints-body-background
  issue: "#14752"
  fixed: "d3c7355ce7d"
  text: "an html element besides the root → the body background over the page (a car maker's consent dialog)"
  prefix: ["image-differs", "empty-root", "empty-iframe", "empty-canvas", "blank-page", "less-content", "cookie-banner",
           "layout:", "mobile-layout:"]
  js: |
    const search = (root, d) => { for (const e of root.querySelectorAll('*')) {
      if (e.tagName === 'HTML' && e !== document.documentElement) return (d ? 'shadow ' : '') + 'html.' + String(e.className).split(' ')[0] + ' in ' + (e.getRootNode().host ? e.getRootNode().host.tagName.toLowerCase() : 'the document');
      if (e.shadowRoot && d < 4) { const t = search(e.shadowRoot, d + 1); if (t) return t; } } return false; };
    return search(document, 0);

# 2026-11-15: order is ignored in a row-reverse/column-reverse flex in Ladybird (the sorting is reversed and the layout
# reverses again): the "Mitt konto" template used by public transport companies shows the login box on the left. Runs in
# the reference browser: a visible reversed flex container whose items have different order.
- id: order-ignored-in-reverse-flex
  issue: "#14749"
  fixed: "9e9b86542cd"
  text: "order is ignored in row-reverse/column-reverse (the \"Mitt konto\" template, several sites)"
  prefix: ["layout:", "mobile-layout:", "image-differs", "less-content", "overflow"]
  js: |
    for (const e of Array.from(document.querySelectorAll('body *')).slice(0, 8000)) {
      const s = getComputedStyle(e);
      if (!/flex/.test(s.display) || !/reverse/.test(s.flexDirection)) continue;
      const r = e.getBoundingClientRect(); if (r.width < 20 || r.height < 10) continue;
      const orders = new Set();
      for (const c of e.children) { const cs = getComputedStyle(c); if (cs.position === 'absolute' || cs.position === 'fixed' || cs.display === 'none') continue;
        const cr = c.getBoundingClientRect(); if (cr.width > 0 && cr.height > 0) orders.add(cs.order); }
      if (orders.size > 1) return e.tagName.toLowerCase() + '.' + String(e.className).split(' ')[0].slice(0, 30) + ' ' + s.flexDirection + ' order ' + [...orders].join('/');
    }
    return false;

# 2026-11-15: an image as a flex item with a percentage max-width gets automatic minimum width 0 in Ladybird (per
# css-sizing-3 §5.2.1, but not in Chromium/Firefox) and is shrunk: on two sites a badge 62×112 against 112×112 and an image
# 350 against 700. Runs in the reference browser: an img in a row flex with a percentage max-width that becomes narrower
# when min-width is temporarily set to 0 (imitating Ladybird's behaviour).
- id: flex-item-img-percent-max-width-shrinks
  issue: "#14740"
  fixed: "6beff376383"
  text: "a flex item img with a percentage max-width is shrunk below its size"
  regex: '^(mobile-)?layout:(width|height|position|missing):[\w-]*flex>img'
  js: |
    for (const i of Array.from(document.images).slice(0, 3000)) {
      const p = i.parentElement; if (!p) continue;
      const ps = getComputedStyle(p), s = getComputedStyle(i);
      if (!/flex/.test(ps.display) || /column/.test(ps.flexDirection) || !/%/.test(s.maxWidth)) continue;
      const before = i.getBoundingClientRect(); if (before.width < 8 || before.height < 8) continue;
      // imitate Ladybird's behaviour: automatic minimum width 0 – if the image gets narrower, Ladybird would shrink it
      const old = i.style.getPropertyValue('min-width'), prio = i.style.getPropertyPriority('min-width');
      i.style.setProperty('min-width', '0px', 'important');
      const after = i.getBoundingClientRect().width;
      if (old) i.style.setProperty('min-width', old, prio); else i.style.removeProperty('min-width');
      if (after < before.width - 2) return 'img ' + Math.round(before.width) + 'x' + Math.round(before.height) + ' → ' + Math.round(after) + ' with min-width 0 (max-width ' + s.maxWidth + ')';
    }
    return false;

# 2026-11-11: three abspos bugs (filed by us). #14334 and #14335 run in the reference browser (structure; #14335 also
# ::before/::after), #14336 in the reference browser via the style rules. The tests run at desktop width, so they do not
# require anything to stick out.
- id: abspos-input-left-right-width-auto-not-stretched
  issue: "#14334"
  fixed: "5f19d6f289"
  text: "an absolute <input>/<textarea> with left and right and width: auto is not stretched"
  prefix: ["mobile-overflow", "overflow", "mobile-layout:", "layout:"]
  js: |
    // In the reference browser: the field fills the space between left and right, but a static copy in the same place is
    // as wide as the field only if the width is specified – otherwise it is width: auto that stretches (what Ladybird does not do).
    for (const e of document.querySelectorAll('input, textarea')) {
      const cs = getComputedStyle(e); if (cs.position !== 'absolute') continue;
      if (e.type && /^(hidden|checkbox|radio|image|range|color|file)$/.test(e.type)) continue;
      const cb = e.offsetParent; if (!cb || !e.parentElement) continue;
      const r = e.getBoundingClientRect(), c = cb.getBoundingClientRect(); if (r.width < 20) continue;
      const left = c.left + cb.clientLeft + parseFloat(cs.left) + parseFloat(cs.marginLeft);
      const right = c.left + cb.clientLeft + cb.clientWidth - parseFloat(cs.right) - parseFloat(cs.marginRight);
      if (Math.abs(r.left - left) > 1 || Math.abs(r.right - right) > 1) continue;
      const k = e.cloneNode(false); k.removeAttribute('id'); k.style.position = 'static'; k.style.left = k.style.right = 'auto';
      e.parentElement.insertBefore(k, e); const w = k.getBoundingClientRect().width; k.remove();
      if (Math.abs(w - r.width) > 4) return e.tagName.toLowerCase() + (e.id ? '#' + e.id : '') + ' ' + Math.round(r.width) + ' px (natural ' + Math.round(w) + ')';
    }
    return false;

- id: abspos-inline-containing-block-not-clipped
  issue: "#14335"
  fixed: "d880f4c326"
  text: "an absolute box with a positioned inline as its containing block is not clipped by overflow: hidden"
  prefix: ["mobile-overflow", "overflow", "mobile-layout:", "layout:"]
  js: |
    const pos = e => e && getComputedStyle(e).position !== 'static';
    const probe = (owner, cs, rect) => {   // owner: the element whose containing block is searched for (for ::after: the element itself counts)
      let cb = owner; while (cb && cb !== document.body && !pos(cb)) cb = cb.parentElement;
      if (!cb || cb === document.body || getComputedStyle(cb).display !== 'inline') return false;
      for (let k = cb.parentElement; k && k !== document.body; k = k.parentElement) {
        const kc = getComputedStyle(k);
        if (/hidden|clip/.test(kc.overflowX)) {
          let p = k.parentElement; while (p && p !== document.body && !pos(p)) p = p.parentElement;
          if (!p || p === document.body) return false;
          const kr = k.getBoundingClientRect(); return rect.right - kr.right > 1 || kr.left - rect.left > 1;
        }
        if (pos(k)) return false;
      }
      return false; };
    const all = Array.from(document.querySelectorAll('body *')).slice(0, 6000);
    for (const e of all) {
      const cs = getComputedStyle(e);
      if (cs.position === 'absolute' && probe(e.parentElement, cs, e.getBoundingClientRect())) return e.tagName.toLowerCase() + '.' + e.className;
      for (const ps of ['::before', '::after']) {
        const p = getComputedStyle(e, ps); if (p.content === 'none' || p.position !== 'absolute') continue;
        let cb = e; while (cb && !pos(cb)) cb = cb.parentElement; if (!cb) continue;
        const cr = cb.getBoundingClientRect(), v = cr.left + (parseFloat(p.left) || 0);
        if (probe(e, p, {left: v, right: v + (parseFloat(p.width) || 0)})) return e.tagName.toLowerCase() + '.' + e.className + ps;
      }
    }
    return false;

- id: abspos-top-bottom-width-auto-image-natural-width
  issue: "#14336"
  fixed: "5f19d6f289"
  text: "an absolute box with top/bottom and width: auto gets the image's natural width when the image has height: 100%"
  prefix: ["mobile-overflow", "overflow", "mobile-layout:", "layout:"]
  js: |
    // Reads the style rules, also in media queries that do not apply now (the test runs at desktop width, the bug often only
    // shows in the mobile view): an absolute box with top and bottom, left or right auto and some rule with width: auto
    // (or no width rule), with an image inside that has a percentage height.
    const rules = []; const walk = rs => { for (const r of rs) { if (r.selectorText) rules.push(r); try { if (r.cssRules) walk(r.cssRules); } catch (e) {} } };
    for (const ss of document.styleSheets) { try { walk(ss.cssRules); } catch (e) {} }
    const values = (e, prop) => { const v = []; if (e.style.getPropertyValue(prop)) v.push(e.style.getPropertyValue(prop));
      for (const r of rules) { const x = r.style.getPropertyValue(prop); if (x) { try { if (e.matches(r.selectorText)) v.push(x.trim()); } catch (y) {} } } return v; };
    let n = 0;
    for (const img of document.images) {
      if (++n > 300) break;
      if (!values(img, 'height').some(v => /%$/.test(v))) continue;
      let a = img.parentElement; while (a && a !== document.body && getComputedStyle(a).position === 'static') a = a.parentElement;
      if (!a || a === document.body || getComputedStyle(a).position !== 'absolute') continue;
      const top = values(a, 'top'), bottom = values(a, 'bottom'), w = values(a, 'width');
      if (!top.some(v => v !== 'auto') || !bottom.some(v => v !== 'auto')) continue;
      const left = values(a, 'left'), right = values(a, 'right');   // left and right set → the width comes from them, not shrink-to-fit
      if (left.some(v => v !== 'auto') && right.some(v => v !== 'auto') && !left.includes('auto') && !right.includes('auto')) continue;
      if (!w.length || w.includes('auto')) return (a.className || a.tagName) + ' > … > img (height ' + values(img, 'height')[0] + ')';
    }
    return false;

# 2026-11-12: in a -webkit-line-clamp box an inline child's offsetHeight/getClientRects end at the clamp, so pages that
# compare the child's height with the box's (DSpace 7 truncatable) never show "Show more" (a site). The check runs in
# Ladybird: a clamped box that overflows (scrollHeight is right) although none of its inline children is taller than the
# box. In the reference browser it could not be told apart from a site where the text wraps into fewer lines in Ladybird
# and the box does not overflow.
- id: line-clamp-inline-child-height-ends-at-clamp
  issue: "#14453"
  fixed: "09187f62df"
  text: "an inline child in a -webkit-line-clamp box: height and rects end at the clamp (DSpace 7 \"Show more\")"
  regex: '^(mobile-)?layout:missing:block>button$'
  run_in: ladybird
  js: |
    for (const e of Array.from(document.querySelectorAll('body *')).slice(0, 8000)) {
      const c = getComputedStyle(e);
      if (!/^\d+$/.test(c.webkitLineClamp) || e.scrollHeight <= e.clientHeight + 4 || !e.children.length) continue;
      const children = Array.from(e.children);
      const inChildren = children.reduce((n, b) => n + b.textContent.trim().length, 0);   // the text should be in the children, not directly in the box
      if (inChildren >= 0.9 * e.textContent.trim().length && children.every(b => getComputedStyle(b).display === 'inline' && b.offsetHeight <= e.clientHeight + 4))
        return e.tagName.toLowerCase() + (e.className ? '.' + String(e.className).split(' ')[0] : '') + ' ' + e.clientHeight + '/' + e.scrollHeight;
    }
    return false;

# 2026-11-12: inline elements entirely after the clamp in a line-clamp box get width 0 (the same mechanism as #14453; a
# site). Runs in Ladybird.
- id: line-clamp-inline-after-clamp-zero-width
  issue: "#14453"
  fixed: "09187f62df"
  text: "inline elements after the clamp in a -webkit-line-clamp box get width 0"
  regex: '^(mobile-)?layout:missing:block>inline(-block)?$'
  run_in: ladybird
  mobile: true
  js: |
    for (const e of Array.from(document.querySelectorAll('body *')).slice(0, 8000)) {
      if (getComputedStyle(e).display !== 'inline') continue;
      const r = e.getBoundingClientRect(); if (r.width !== 0 || !r.height || !(e.textContent || '').trim()) continue;
      for (let a = e.parentElement, d = 0; a && d < 8; a = a.parentElement, d++)
        if (/^\d+$/.test(getComputedStyle(a).webkitLineClamp) && a.scrollHeight > a.clientHeight + 4) return a.tagName.toLowerCase() + '.' + String(a.className).split(' ')[0];
    }
    return false;

# 2026-11-14: an inline box that only contains <br> does not count its line-height in the line's height (Chromium and
# Firefox do; 2d2a0886e6 fixed inline boxes with only atomic children). Common spacing from WordPress editors:
# <p><span style="font-size: …"><br></span></p> (on a site an h3 19 against 56). Runs in Ladybird: a visible <br> whose
# parent is inline and has no other content, whose line-height is larger than the block's, and whose box only has the
# block's height.
- id: inline-box-with-only-br-ignores-line-height
  issue: "#14641"
  fixed: "88bca845328"
  text: "an inline box with only <br> does not count its line-height"
  prefix: ["layout:", "mobile-layout:", "less-content", "shorter-page", "image-differs"]
  run_in: ladybird
  mobile: true
  js: |
    const lh = s => s.lineHeight === 'normal' ? 1.2 * parseFloat(s.fontSize) : parseFloat(s.lineHeight);
    for (const br of document.querySelectorAll('body br')) {
      const p = br.parentElement; if (!p) continue;
      const ps = getComputedStyle(p); if (ps.display !== 'inline') continue;
      if ([...p.childNodes].some(n => n.nodeType === 1 ? n.tagName !== 'BR' : (n.nodeType === 3 && n.textContent.trim()))) continue;
      let b = p.parentElement; while (b && getComputedStyle(b).display.startsWith('inline')) b = b.parentElement;
      if (!b) continue;
      const bs = getComputedStyle(b), br_ = br.getBoundingClientRect(), bb = b.getBoundingClientRect();
      if (bb.width < 1 || bb.height < 1 || bs.visibility === 'hidden') continue;
      if (lh(ps) > lh(bs) + 4 && br_.height < lh(ps) - 4)
        return b.tagName.toLowerCase() + '>' + p.tagName.toLowerCase() + ' lh=' + lh(ps).toFixed(0) + ' block=' + lh(bs).toFixed(0) + ' br=' + br_.height.toFixed(0);
    }
    return false;

# 2026-11-14: Ladybird forces line-height: normal on every select (StyleEngineInput.cpp ForceLineHeightNormal), also with
# appearance: none where Chromium and Firefox use the page's line-height (on two sites a CF7 select 56 against 63 px). Runs
# in the reference browser: a visible select with appearance: none whose content height is its line-height and larger
# than normal.
- id: select-appearance-none-line-height-ignored
  issue: "#14612"
  fixed: "d3193396835"
  text: "line-height is ignored on a select with appearance: none"
  prefix: ["layout:", "mobile-layout:", "less-content", "shorter-page", "image-differs"]
  js: |
    for (const e of document.querySelectorAll('select')) {
      const s = getComputedStyle(e);
      if (s.appearance !== 'none' || s.lineHeight === 'normal') continue;
      const r = e.getBoundingClientRect(); if (r.width < 1 || r.height < 1) continue;
      const lh = parseFloat(s.lineHeight);
      const inner = r.height - ['paddingTop', 'paddingBottom', 'borderTopWidth', 'borderBottomWidth'].reduce((a, k) => a + parseFloat(s[k]), 0);
      if (Math.abs(inner - lh) > 1.5) continue;
      const probe = document.createElement('span'); probe.textContent = 'Xg';
      probe.style.cssText = `font:${s.font};line-height:normal;position:absolute;visibility:hidden`;
      document.body.appendChild(probe); const normal = probe.getBoundingClientRect().height; probe.remove();
      if (lh > normal + 2) return 'select lh=' + s.lineHeight + ' normal≈' + normal.toFixed(1);
    }
    return false;

# 2026-11-13: an atomic inline whose border box fits on the line but whose positive right margin does not is not wrapped
# to the next line (inline_formatting_context.rs only counts negative margins). Sponsor logos and social icons on several
# sites. Runs in Ladybird: an inline-block/-flex/-grid/-table, not first on the line, whose right margin goes outside the
# parent block's content box while the border box fits.
- id: inline-block-margin-not-fitting-not-wrapped
  issue: "#14572"
  fixed: "56aba0318a5"
  text: "an inline-block whose margin does not fit is not wrapped to the next line (sponsor logos, social icons)"
  prefix: ["layout:", "mobile-layout:", "less-content", "shorter-page", "image-differs"]
  run_in: ladybird
  mobile: true
  js: |
    for (const e of document.querySelectorAll('body *')) {
      const s = getComputedStyle(e);
      if (!/^inline-(block|flex|grid|table)$/.test(s.display)) continue;
      // 2026-11-13 (a site): also a positive left margin – then the box itself ends up outside the line
      const mr = Math.max(0, parseFloat(s.marginRight)), ml = Math.max(0, parseFloat(s.marginLeft));
      if (!(mr + ml > 0.5)) continue;
      let p = e.parentElement; while (p && /^inline/.test(getComputedStyle(p).display)) p = p.parentElement;
      if (!p) continue;
      const ps = getComputedStyle(p); if (/nowrap|pre$/.test(ps.whiteSpace) || ps.textWrapMode === 'nowrap') continue;
      const pr = p.getBoundingClientRect(), r = e.getBoundingClientRect();
      if (r.width < 1 || r.height < 1) continue;
      const right = pr.right - parseFloat(ps.paddingRight) - parseFloat(ps.borderRightWidth);
      const left = pr.left + parseFloat(ps.paddingLeft) + parseFloat(ps.borderLeftWidth);
      if (r.right + mr > right + 0.5 && r.width + ml + mr <= right - left + 0.5 && r.left - ml > left + 1)
        return 'margin outside the line: ' + e.tagName.toLowerCase() + '.' + (e.classList[0] || '') + ' ml=' + ml + ' mr=' + mr;
    }
    return false;

# 2026-11-13: a float in a multi-column block – in the container's own lines everything becomes one column (a site's list
# of municipalities), floating children are balanced wrongly (another site). Runs in the reference browser: a multi-column
# block with a floating direct child (a float inside a child block works in Ladybird and does not count).
- id: float-in-multicol-block
  issue: "#14545"
  fixed: "241e3b9e99c"
  text: "a float in a multi-column block: one column or wrong balance"
  prefix: ["layout:", "mobile-layout:", "less-content", "shorter-page", "image-differs"]
  js: |
    for (const e of document.querySelectorAll('body *')) {
      const s = getComputedStyle(e);
      if (!((s.columnCount !== 'auto' && s.columnCount !== '1') || s.columnWidth !== 'auto')) continue;
      if (e.getBoundingClientRect().height < 20) continue;
      for (const c of e.children)
