# 2026-11-14: a negative and a positive bottom margin that collapse to exactly 0 give only the negative one in Ladybird,
# when the chain ends in a BFC root (flow-root, flex item …) – on a site (.mc1 -500px > .mc2 500px) the section was 500 px
# too short and the text overlapped. Runs in the reference browser: a last child X with a negative bottom margin without
# bottom padding/border, whose last child has a positive one that cancels it, in a BFC root.
- id: bottom-margins-collapsing-to-zero-keep-negative
  issue: "#14684"
  fixed: "dfd48da8441"
  text: "bottom margins that collapse to exactly 0 give only the negative one (BFC root too short)"
  prefix: ["layout:", "mobile-layout:", "image-differs", "less-content", "shorter-page", "overflow", "zero-size-text"]
  js: |
    const bfc = p => { const s = getComputedStyle(p), f = p.parentElement && getComputedStyle(p.parentElement).display;
      return /flow-root|inline-block|table-cell/.test(s.display) || s.overflow !== 'visible' || /flex|grid/.test(f || '') || s.float !== 'none' || /absolute|fixed/.test(s.position); };
    const last = e => { let c = e.lastElementChild;
      while (c && (/absolute|fixed/.test(getComputedStyle(c).position) || getComputedStyle(c).display === 'none' || getComputedStyle(c).float !== 'none')) c = c.previousElementSibling;
      return c; };
    for (const x of document.querySelectorAll('body *')) {
      const s = getComputedStyle(x), m1 = parseFloat(s.marginBottom);
      if (!(m1 < 0) || parseFloat(s.paddingBottom) || parseFloat(s.borderBottomWidth) || s.display !== 'block' || bfc(x)) continue;
      const c = last(x); if (!c || getComputedStyle(c).display !== 'block') continue;
      const m2 = parseFloat(getComputedStyle(c).marginBottom);
      if (!(m2 > 0) || Math.abs(m1 + m2) > 0.01) continue;
      const p = x.parentElement; if (!p || last(p) !== x || !bfc(p)) continue;
      if (x.getBoundingClientRect().height > 20) return 'margins ' + m1 + '/' + m2 + ' in ' + p.tagName.toLowerCase() + '.' + (p.classList[0] || '');
    }
    return false;

- id: float-negative-margin-top-after-inline-content
  issue: "#14149"
  fixed: "3576a58647"
  text: "a float with a negative margin-top after inline content on the same line pushes the content aside (2026-11-10)"
  prefix: ["mobile-overflow", "overflow", "layout:position:", "mobile-layout:position:"]
  js: |
    // A float with a negative margin-top whose nearest previous sibling is inline content that (in the reference browser) ends below the float's top edge
    const inl = n => n.nodeType === 3 ? n.textContent.trim() !== '' : n.nodeType === 1 && (/^inline/.test(getComputedStyle(n).display) || n.tagName === 'IMG');
    for (const f of Array.from(document.querySelectorAll('body *')).slice(0, 6000)) {
      const c = getComputedStyle(f); if (c.float === 'none' || !(parseFloat(c.marginTop) < 0)) continue;
      let p = f.previousSibling; while (p && ((p.nodeType === 3 && !p.textContent.trim()) || p.nodeType === 8 || (p.nodeType === 1 && getComputedStyle(p).display === 'none'))) p = p.previousSibling;
      if (!p || !inl(p)) continue;
      const r = document.createRange(); r.selectNode(p); const pb = r.getBoundingClientRect(), fb = f.getBoundingClientRect();
      if (pb.height > 0 && fb.height > 0 && pb.bottom > fb.top + 1) return (f.className || f.tagName) + ' margin-top ' + c.marginTop;
    }
