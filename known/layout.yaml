      if (/normal|stretch/.test(ps.alignItems) === false && s.alignSelf === 'auto') continue;
      const r = e.getBoundingClientRect(); if (r.width < 50 || r.height < 10 || !(e.textContent.trim() || e.querySelector('img, video, svg'))) continue;   // one site: only an image
