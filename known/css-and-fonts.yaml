# Known bug patterns in CSS parsing, the cascade and computed values, and in font loading and font fallback.

# 2026-11-14: when no family in the stack is found, Ladybird falls back to sans-serif, the other engines to the default
# font (serif). Runs in the reference browser: visible text whose stack lacks a generic family and is drawn with the same
# width as serif but not as sans-serif (= no family was found).
- id: font-stack-without-match-or-generic-family
  issue: "#14682"
  text: "a stack without a match and without a generic family: Ladybird uses sans-serif, the others serif"
  prefix: ["layout:", "mobile-layout:", "image-differs", "less-content", "shorter-page", "zero-size-text", "overflow"]
  js: |
    const GEN = /(^|,)\s*(sans-serif|serif|monospace|cursive|fantasy|system-ui|ui-[a-z-]+|math|emoji|fangsong)\s*(,|$)/i;
    const probe = document.createElement('span'); probe.style.fontFamily = 'initial'; document.documentElement.appendChild(probe);
    const standard = getComputedStyle(probe).fontFamily; probe.remove();
    const measure = (fam, s) => { const x = document.createElement('span'); x.style.cssText = `position:absolute;visibility:hidden;white-space:nowrap;font:${s.fontStyle} ${s.fontWeight} 20px ${fam}`;
                                  x.textContent = 'Hamburgefonstiv 0123'; document.body.appendChild(x); const w = x.getBoundingClientRect().width; x.remove(); return w; };
    const seen = new Set();
    for (const e of document.querySelectorAll('body *')) {
      if (![...e.childNodes].some(n => n.nodeType === 3 && n.textContent.trim())) continue;
      const r = e.getBoundingClientRect(); if (r.width < 1 || r.height < 1) continue;
      const s = getComputedStyle(e), fam = s.fontFamily;
      if (fam === standard || GEN.test(fam) || seen.has(fam)) continue; seen.add(fam);
      const w = measure(fam, s);
      if (Math.abs(w - measure('serif', s)) < 0.5 && Math.abs(w - measure('sans-serif', s)) > 2) return 'no match: ' + fam.slice(0, 60);
    }
    return false;

# 2026-11-14: Arial, Times New Roman and Courier New do not follow fontconfig's metric aliases (Liberation Sans/Serif/Mono)
# in Ladybird on Linux – the stack falls through to the next family (on a site: Arial, Courier, monospace → everything in
# monospace). Runs in the reference browser: visible text whose stack starts with such a family (not a web font) and whose
# next family is not the matching generic or Liberation family.
- id: metric-font-aliases-not-followed
  issue: "#14680"
  text: "Arial/Times New Roman/Courier New do not follow fontconfig aliases"
  prefix: ["layout:", "mobile-layout:", "image-differs", "less-content", "shorter-page", "zero-size-text", "overflow"]
  js: |
    // what differs: Ladybird skips the family; the next generic family in the stack (with none: sans-serif, Ladybird's
    // default) decides – only visible when it is not the alias's own category
    const TARGET = {'arial': 'sans-serif', 'times new roman': 'serif', 'courier new': 'monospace'};
    const GEN = ['sans-serif', 'serif', 'monospace', 'cursive', 'fantasy', 'system-ui', 'ui-sans-serif', 'ui-serif', 'ui-monospace'];
    const web = new Set([...document.fonts].map(f => f.family.replace(/["']/g, '').toLowerCase()));
    // the reference browser reports its default as "Times New Roman" – the same font as Ladybird's serif, no difference (2026-11-14)
    const probe = document.createElement('span'); probe.style.fontFamily = 'initial'; document.documentElement.appendChild(probe);
    const standard = getComputedStyle(probe).fontFamily; probe.remove();
    for (const e of document.querySelectorAll('body *')) {
      if (![...e.childNodes].some(n => n.nodeType === 3 && n.textContent.trim())) continue;
      const r = e.getBoundingClientRect(); if (r.width < 1 || r.height < 1) continue;
      if (getComputedStyle(e).fontFamily === standard) continue;
      const fam = getComputedStyle(e).fontFamily.split(',').map(x => x.trim().replace(/["']/g, '').toLowerCase());
      const first = fam[0]; if (!TARGET[first] || web.has(first)) continue;
      const gen = fam.slice(1).find(x => GEN.includes(x)) || 'sans-serif';
      if (gen !== TARGET[first]) return fam.slice(0, 4).join(', ') + ' → ' + gen;
    }
    return false;

- id: font-file-content-type-mismatch
  issue: "#14139"
  fixed: "d880f4c326"
  text: "the font file's content does not match its Content-Type (e.g. TrueType served as font/woff2)"
  prefix: ["font-error:"]
  async: true
  js: |
    const urls = new Set();
    const walk = rs => { for (const r of rs) {
      if (r instanceof CSSFontFaceRule) { const m = (r.style.getPropertyValue('src') || '').match(/url\(\s*["']?([^"')]+)["']?\s*\)/);   // first source
        if (m) try { urls.add(new URL(m[1], (r.parentStyleSheet && r.parentStyleSheet.href) || location.href).href); } catch (e) {} }
      else if (r instanceof CSSImportRule) { try { if (r.styleSheet) walk(r.styleSheet.cssRules); } catch (e) {} }
      else try { if (r.cssRules) walk(r.cssRules); } catch (e) {} } };
    for (const ss of document.styleSheets) { try { walk(ss.cssRules); } catch (e) {} }
    const sfnt = ['\x00\x01\x00\x00', 'OTTO', 'true', 'ttcf'], woff = ['wOFF'], woff2 = ['wOF2'];
    const types = {'font/woff2': woff2, 'application/font-woff2': woff2, 'font/woff': woff, 'application/font-woff': woff, 'font/x-woff': woff,
                   'font/ttf': sfnt, 'application/x-font-ttf': sfnt, 'font/otf': sfnt};
    setTimeout(() => done(false), 10000);
    Promise.all([...urls].filter(u => /^https?:/.test(u)).slice(0, 30).map(u => fetch(u, {headers: {Range: 'bytes=0-3'}}).then(async r => {
      const t = (r.headers.get('content-type') || '').split(';')[0].trim().toLowerCase();
      const magic = String.fromCharCode(...new Uint8Array(await r.arrayBuffer()).slice(0, 4));
      return types[t] && !types[t].includes(magic) ? u : null; }).catch(() => null)))
      .then(x => { x = x.filter(Boolean); done(x.length ? x.slice(0, 3) : false); });

- id: webkit-font-feature-settings-or-clip-path-only
  issue: "#14203"
  fixed: "d880f4c326"
  text: "-webkit-font-feature-settings / -webkit-clip-path without the unprefixed property"
  prefix: ["css-dropped:font-feature-settings:", "css-dropped:clip-path:"]
  async: true
  js: |
    const re = /-webkit-(font-feature-settings|clip-path)\s*:/;
    setTimeout(() => done(false), 10000);
    const inline = [...document.querySelectorAll('style')].some(s => re.test(s.textContent));
    if (inline) return done(['inline']);
    const sheets = [...document.styleSheets].map(s => s.href).filter(h => h && /^https?:/.test(h)).slice(0, 15);
    Promise.all(sheets.map(h => fetch(h).then(r => r.text()).then(t => re.test(t) ? h : null).catch(() => null)))
      .then(x => { x = x.filter(Boolean); done(x.length ? x.slice(0, 3) : false); });

