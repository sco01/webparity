# SPDX-License-Identifier: BSD-2-Clause
# Measurement artefacts and known differences that are not Ladybird bugs (or not filed yet) and explain findings away.

# 2026-11-14: a list box (<select multiple>/size > 1) under the middle of the window: Ladybird scrolls the inner list in
# the shadow tree but select.scrollTop stays 0, so the wheel probe sees "no scrolling" where the reference browser sees
# select.scrollTop 400. No visible effect. Runs in the reference browser.
- id: listbox-scrolltop-always-zero
  issue: "measurement-listbox-scrolltop"
  text: "a list box under the pointer: Ladybird's select.scrollTop is always 0"
  prefix: ["scroll-locked"]
  js: |
    for (const e of document.elementsFromPoint(innerWidth / 2, innerHeight / 2)) {
      const s = e.tagName === 'OPTION' ? e.closest('select') : e;
      if (s && s.tagName === 'SELECT' && (s.multiple || s.size > 1) && s.scrollHeight > s.clientHeight + 1)
        return 'list box ' + (s.name || s.id || '');
    }
    return false;

# 2026-11-12: text-overflow: ellipsis changes the layout in Ladybird – the fragment with the ellipsis is shortened and
# inline elements entirely after the ellipsis get width 0 (at the start of the line); in Chromium and Firefox they keep
# their width outside the box. No visible effect found (several sites, a publisher's author names). Draft issue
# (class 4, not filed). Runs in Ladybird.
- id: inline-after-text-overflow-ellipsis-zero-width
  issue: "draft:ellipsis-inline"
  text: "inline elements entirely after a text-overflow ellipsis get width 0 (several sites)"
  regex: '^(mobile-)?layout:missing:block>inline(-block)?$'
  run_in: ladybird
  mobile: true
  js: |
    for (const e of Array.from(document.querySelectorAll('body *')).slice(0, 8000)) {
      if (getComputedStyle(e).display !== 'inline') continue;
      const r = e.getBoundingClientRect(); if (r.width !== 0 || !r.height || !(e.textContent || '').trim()) continue;
      for (let a = e.parentElement, d = 0; a && d < 8; a = a.parentElement, d++) {
        const c = getComputedStyle(a);
        if (c.textOverflow === 'ellipsis' && c.overflow !== 'visible' && a.scrollWidth > a.clientWidth) return a.tagName.toLowerCase() + '.' + String(a.className).split(' ')[0] + ' ' + a.clientWidth + '/' + a.scrollWidth;
      }
    }
    return false;

# 2026-11-15: an inline element whose only children are floats (Sitevision's div.sv-row/ul.sol-breadcrumbs with display
# inline, menus): Chromium gives it the block's width, Ladybird width 0 and Firefox 0×0 – Ladybird ≈ Firefox, no visible
# effect (several sites). Runs in the reference browser.
- id: inline-with-only-floating-children-width
  issue: "known:cr-inline-floating-children"
  text: "an inline element with only floating children: Chromium gives it a width, Ladybird/Firefox 0"
  regex: '^(mobile-)?layout:missing:block>inline$'
  js: |
    for (const e of Array.from(document.querySelectorAll('body *')).slice(0, 8000)) {
      const s = getComputedStyle(e); if (s.display !== 'inline' || !e.children.length) continue;
      if ([...e.childNodes].some(n => n.nodeType === 3 && n.textContent.trim())) continue;
      if (![...e.children].every(c => { const cs = getComputedStyle(c); return cs.float !== 'none' || cs.display === 'none' || cs.position === 'absolute'; })) continue;
      if (![...e.children].some(c => getComputedStyle(c).float !== 'none')) continue;
      if (e.getBoundingClientRect().width > 0) return e.tagName.toLowerCase() + '.' + String(e.className).split(' ')[0];
    }
    return false;

# 2026-11-14: a known difference without visible effect. Block children after the clamp in a -webkit-line-clamp box
# (overflow hidden): Chromium gives them one line's height, Ladybird the full height – they are invisible in both (a site,
# Tailwind line-clamp-3 around several p). Runs in the reference browser: a clamped line-clamp box with a block child
# that starts below the box's bottom.
- id: line-clamp-block-children-height
  issue: "known:line-clamp-block"
  text: "block children after the clamp in a line-clamp box have different heights (invisible)"
  prefix: ["layout:", "mobile-layout:", "zero-size-text"]
  js: |
    for (const e of document.querySelectorAll('body *')) {
      const s = getComputedStyle(e);
      if (!s.webkitLineClamp || s.webkitLineClamp === 'none' || !/hidden|clip/.test(s.overflow)) continue;
      const r = e.getBoundingClientRect(); if (r.height < 1) continue;
      for (const c of e.querySelectorAll('p, div, li, h1, h2, h3, h4, h5, h6')) {
        if (getComputedStyle(c).display.startsWith('inline')) continue;
        if (c.getBoundingClientRect().top >= r.bottom - 1) return 'line-clamp ' + (e.classList[0] || e.tagName.toLowerCase());
      }
    }
    return false;

# 2026-11-14: a known difference (class 4, saved). Ladybird does not give content-visibility: auto size containment when
# the element is not relevant to the user (table_group_builder.rs only hooks up hidden), so contain-intrinsic-size is not
# used off screen – on a site an empty section is 24 px against 2571. Runs in the reference browser: an element with
# content-visibility: auto and contain-intrinsic-height/-size outside the viewport that is at least 100 px high.
# 2026-11-25: also without contain-intrinsic-size – a Shopify theme's footer grid (.footer-content) is 72 px off screen in
# Chromium and Firefox (only its padding) and 168 px in Ladybird, which lays out the contents. Also matches a non-empty
# content-visibility: auto element off screen whose content box is empty in the reference.
- id: content-visibility-auto-no-intrinsic-size
  issue: "known:cv-auto"
  text: "content-visibility: auto off screen does not get contain-intrinsic-size"
  prefix: ["layout:", "mobile-layout:", "image-differs", "less-content", "shorter-page", "zero-size-text"]
  js: |
    for (const e of document.querySelectorAll('body *')) {
      const s = getComputedStyle(e);
      if (s.contentVisibility !== 'auto') continue;
      const r = e.getBoundingClientRect();
      if (!(r.top > innerHeight * 1.5 || r.bottom < -innerHeight * 0.5)) continue;
      const name = 'cv-auto ' + e.tagName.toLowerCase() + '.' + (e.classList[0] || '') + ' ' + Math.round(r.height);
      const noIntrinsic = (s.containIntrinsicHeight || 'none') === 'none' && (s.containIntrinsicBlockSize || 'none') === 'none';
      if (!noIntrinsic && r.height >= 100) return name;
      const box = r.height - ['paddingTop', 'paddingBottom', 'borderTopWidth', 'borderBottomWidth'].reduce((a, k) => a + parseFloat(s[k]), 0);
      const given = parseFloat(String(s.containIntrinsicHeight || '').split(' ').pop()) || 0;
      if (e.children.length && e.textContent.trim() && Math.abs(box - given) < 2) return name + ' (contents skipped)';
    }
    return false;

# 2026-11-14: a percentage row-gap in a column flex with auto height: Chromium and Firefox give 0, Ladybird resolves it
# against the final height (and shrinks the children) – on a site row-gap 7 %, the spacer 53 → 21, no visible difference.
# Class 4 until a page with a visible effect turns up. Runs in the reference browser: a column flex with a percentage
# row-gap and ≥ 2 visible children.
- id: percent-row-gap-in-auto-height-column-flex
  issue: "draft:percent-rowgap"
  text: "a percentage row-gap in a column flex with auto height is resolved against the height (Chromium/Firefox: 0)"
  prefix: ["layout:", "mobile-layout:", "image-differs", "less-content", "shorter-page", "overflow"]
  js: |
    for (const e of document.querySelectorAll('body *')) {
      const s = getComputedStyle(e);
      if (!/flex/.test(s.display) || !/^column/.test(s.flexDirection) || !/%/.test(s.rowGap) || parseFloat(s.rowGap) === 0) continue;
      const k = [...e.children].filter(c => { const r = c.getBoundingClientRect(); return r.height > 0 && !/absolute|fixed/.test(getComputedStyle(c).position); });
      if (k.length >= 2) return 'column flex row-gap ' + s.rowGap + ' ' + e.tagName.toLowerCase() + '.' + (e.classList[0] || '');
    }
    return false;

# 2026-11-14: a known difference (Chromium deviates). A broken image (loaded, naturalWidth 0) with sizes="auto" gets the UA
# rule's contain: size, and WordPress sets contain-intrinsic-size: 3000px 1500px; Chromium gives it 1500 px height,
# Ladybird and Firefox the height from the width/height ratio (on a site 201×1500 against 201×201). Runs in the reference
# browser.
- id: broken-sizes-auto-image-contain-intrinsic-size
  issue: "known:cr-broken-image-cis"
  text: "Chromium gives a broken sizes=auto image its height from contain-intrinsic-size (Ladybird = Firefox)"
  prefix: ["layout:", "mobile-layout:", "image-differs", "less-content", "shorter-page", "overflow"]
  js: |
    for (const i of document.querySelectorAll('img')) {
      if (!i.complete || i.naturalWidth || !(i.currentSrc || i.src)) continue;
      const s = getComputedStyle(i); if (!/size/.test(s.contain)) continue;
      const r = i.getBoundingClientRect(), h = parseFloat(s.containIntrinsicHeight);
      if (r.width > 0 && r.height >= 150 && Math.abs(r.height - h) < 2 && r.height > r.width * 1.5) return 'broken image ' + Math.round(r.width) + '×' + Math.round(r.height);
    }
    return false;

# 2026-11-14: a known difference. FullCalendar 5 (getCanVGrowWithinCell: a div with height 100% in a td in a table with
# height 100px) gets 0 in Ladybird and Firefox, 100 in Chromium, and then takes its Firefox path (the header row in tbody,
# a different height distribution) – on a site the calendar is 510 against 511 px. Runs in the reference browser: a
# FullCalendar table.
- id: fullcalendar-takes-firefox-path
  issue: "known:fullcalendar-cell"
  text: "FullCalendar takes its Firefox path in Ladybird (percentage height in a table cell, like Firefox)"
  prefix: ["layout:", "mobile-layout:", "image-differs", "less-content", "shorter-page", "overflow"]
  js: |
    const t = document.querySelector('.fc table.fc-scrollgrid');
    if (!t) return false;
    const r = t.getBoundingClientRect(); return r.width > 0 && r.height > 0 ? 'fullcalendar ' + (t.tHead ? 'thead' : 'without thead') : false;

# 2026-11-14: a measurement error. Chromium and Firefox see the Xvfb screen 3000×2000, Ladybird 1920×1080, so an @media
# with device-width/-height between them only matches in the reference browser (on a site min-device-width: 2000px →
# padding 120 instead of 80). Runs in the reference browser: a matching rule whose condition depends on such a limit and
# whose selector matches a visible element.
- id: media-device-size-between-screens
  issue: "measurement-screen"
  text: "@media device-width/-height between Ladybird's screen (1920×1080) and the Xvfb screen (3000×2000)"
  prefix: ["layout:", "mobile-layout:", "image-differs", "less-content", "shorter-page", "overflow", "zero-size-text"]
  js: |
    const LIMITS = {width: [1920, 3000], height: [1080, 2000]};
    const depends = m => [...m.matchAll(/(min|max)-device-(width|height)\s*:\s*([\d.]+)px/g)].some(([, mm, d, n]) => {
      n = parseFloat(n); const [a, b] = LIMITS[d]; return mm === 'min' ? (n > a && n <= b) : (n >= a && n < b); });
    const visible = sel => { try { return [...document.querySelectorAll(sel)].some(e => { const r = e.getBoundingClientRect(); return r.width > 0 && r.height > 0; }); } catch (e) { return false; } };
    const walk = (rules, condition) => {
      for (const r of rules) {
        if (r.media && r.cssRules) { const mt = r.media.mediaText; const next = condition || (depends(mt) ? mt : null);   // both directions give a difference
          const answer = walk(r.cssRules, next); if (answer) return answer; }
        else if (condition && r.selectorText && visible(r.selectorText)) return condition.slice(0, 50) + ' ' + r.selectorText.slice(0, 50);
      }
      return false;
    };
    for (const s of document.styleSheets) { let rr; try { rr = s.cssRules; } catch (e) { continue; } const answer = walk(rr, null); if (answer) return answer; }
    return false;

# 2026-11-25: a measurement artefact. WebDriver starts Ladybird with --enable-autoplay, so a video may autoplay with
# sound; Chromium blocks that, and players fall back to muted playback with an unmute button (LayerSlider's
# ls-media-unmute-active scales its icon from 0.1 to 1: 3×3 px in Ladybird, 30×30 in Chromium). Runs in the reference
# browser: a playing video muted by script (no muted attribute) and a visible element whose class mentions unmute.
- id: webdriver-autoplay-with-sound
  issue: "measurement-autoplay"
  text: "Ladybird under WebDriver autoplays video with sound, so the player shows no unmute button"
  prefix: ["layout:", "mobile-layout:", "image-differs"]
  js: |
    const v = [...document.querySelectorAll('video')].find(v => !v.paused && v.muted && !v.hasAttribute('muted'));
    if (!v) return false;
    for (const e of document.querySelectorAll('[class*=unmute]')) {
      const r = e.getBoundingClientRect(); if (r.width > 5 && r.height > 5) return 'unmute button ' + String(e.className).slice(0, 50);
    }
    return false;

# 2026-11-25: a measurement artefact. Chromium does not start a muted autoplay video outside the viewport (it plays once
# scrolled into view); Ladybird plays it at once. Until it plays, Chromium sizes the video by its poster, so a page whose
# poster is a broken placeholder (data:image/gif,AAAA) gets a 150 px box in Chromium and the video's own aspect ratio in
# Ladybird (552×150 against 552×555). Runs in the reference browser: a paused autoplay+muted video below or above the
# viewport, with its data loaded, whose box is more than 20 px off the video's aspect ratio.
- id: offscreen-muted-autoplay-paused-in-reference
  issue: "measurement-autoplay"
  text: "Chromium holds back a muted autoplay video outside the viewport, so it keeps its poster size"
  prefix: ["layout:", "mobile-layout:", "image-differs", "shorter-page"]
  js: |
    for (const v of document.querySelectorAll('video[autoplay][muted]')) {
      const r = v.getBoundingClientRect();
      if (!v.paused || v.readyState < 1 || !v.videoWidth || r.width < 50) continue;
      if (r.bottom > 0 && r.top < innerHeight) continue;
      const h = r.width * v.videoHeight / v.videoWidth;
      if (Math.abs(h - r.height) > 20) return 'paused offscreen video ' + Math.round(r.width) + '×' + Math.round(r.height) + ', ratio gives ' + Math.round(h);
    }
    return false;

# 2026-11-26: a measurement artefact. A hero video in HEVC (hvc1): Ladybird decodes it through FFmpeg, Chromium on Linux
# and Firefox do not. Chromium plays only the audio track (readyState 4, videoWidth 0), so the video area stays empty and
# white header text on it is invisible; Ladybird shows the video. Runs in the reference browser: a visible video with its
# metadata loaded but no video size.
- id: reference-cannot-decode-video-track
  issue: "measurement-codec"
  text: "the reference browser cannot decode the video's codec (HEVC on Linux); Ladybird shows the video"
  prefix: ["image-differs", "video"]
  js: |
    for (const v of document.querySelectorAll('video')) {
      const r = v.getBoundingClientRect();
      if (r.width < 200 || r.height < 100 || v.readyState < 1 || v.videoWidth) continue;
      return 'video without a decodable video track ' + (v.currentSrc || '').split('/').pop().slice(0, 50);
    }
    return false;

# 2026-11-26: a measurement difference in scrollbar model. The root has scrollbar-gutter: stable; Chromium (10 px with
# scrollbar-width: thin) and Firefox (6 px) reserve a gutter at the viewport's edge even when nothing scrolls sideways,
# Ladybird's scrollbars overlay the content and reserve none (the spec: no gutter for overlay scrollbars). The page is
# 10 px wider in Ladybird, so a heading near its width limit wraps differently (jetbrains.com in the mobile step: 15 px).
# Runs in the reference browser: a stable
# gutter on the root or body and a root narrower than the viewport.
- id: root-scrollbar-gutter-stable
  issue: "measurement-scrollbar"
  text: "scrollbar-gutter: stable on the root reserves a gutter in the reference browser; Ladybird's overlay scrollbars reserve none"
  prefix: ["layout:", "mobile-layout:", "image-differs", "shorter-page", "less-content", "overflow", "mobile-overflow"]
  mobile: true
  js: |
    const g = e => /stable/.test(getComputedStyle(e).scrollbarGutter);
    const w = document.documentElement.offsetWidth;
    return (g(document.documentElement) || g(document.body)) && w < innerWidth - 2 ? 'root ' + w + ' of ' + innerWidth + ' px' : false;

# 2026-11-26: a measurement artefact. An image whose srcset lists one file under several width descriptors (an ASP.NET
# CMS: the same SVG as 1200w, 992w, 768w …, sizes 100vw). The descriptor sets the density and so the natural size; in
# the mobile step (the viewport narrowed without a reload) Chromium keeps the 1200w candidate it chose at 1440 px
# (density 3.1: a 341 px logo becomes 111 px), Ladybird and Firefox choose again for 390 px (277 px). Runs in the
# reference browser: a visible image whose srcset has one URL under two or more w descriptors.
- id: srcset-same-file-several-widths
  issue: "measurement-srcset"
  text: "srcset lists one file under several w descriptors; Chromium keeps the desktop step's density in the mobile step"
  prefix: ["mobile-layout:"]
  js: |
    for (const i of document.querySelectorAll('img[srcset]')) {
      const r = i.getBoundingClientRect(); if (r.width < 10 || r.height < 10) continue;
      const seen = {};
      for (const part of i.getAttribute('srcset').split(/,\s+/)) {
        const m = part.trim().match(/^(\S+)\s+(\d+)w$/); if (!m) continue;
        seen[m[1]] = (seen[m[1]] || 0) + 1;
        if (seen[m[1]] > 1) return 'one file under several w descriptors: ' + m[1].split('/').pop().slice(0, 50);
      }
    }
    return false;

# 2026-11-26: a measurement artefact of the mobile step (the viewport narrowed without a reload). Isotope/Masonry lays
# its items out again on resize only when the container's width changed. A sidebar gallery 33.33 % of 1170 px is
# exactly 390 px in Chromium and Firefox at 1440 px and at 390 px, so they keep the desktop step's three columns (the
# items, now 360 px wide, overlap); Ladybird's container is 389.984375 px at 1440 (1/64 px), so Isotope lays it out
# again as one column (5230 px against 564). Runs in the reference browser: absolutely positioned items in a masonry
# or isotope container that overlap each other by more than half.
- id: masonry-not-relaid-after-resize
  issue: "measurement-resize"
  text: "an Isotope/Masonry gallery keeps the desktop step's columns in the reference after the viewport narrows"
  prefix: ["mobile-layout:"]
  mobile: true
  js: |
    for (const g of document.querySelectorAll('[class*=masonry], [class*=isotope]')) {
      const items = [...g.children].filter(k => getComputedStyle(k).position === 'absolute').slice(0, 30)
        .map(k => k.getBoundingClientRect()).filter(r => r.width > 20 && r.height > 20);
      for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
        const a = items[i], b = items[j];
        const w = Math.min(a.right, b.right) - Math.max(a.left, b.left), h = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
        if (w > 0 && h > 0 && w * h > 0.5 * Math.min(a.width * a.height, b.width * b.height))
          return 'overlapping items in ' + String(g.className).split(' ')[0].slice(0, 40);
      }
    }
    return false;

# 2026-11-26: a measurement difference. Chromium under WebDriver has geolocation granted, Ladybird and Firefox ask
# (permission state "prompt"), so a booking page's "find near me" button says "geolocation is disabled in your browser"
# in Ladybird and Firefox and is taller. Runs in the reference browser: geolocation granted and a visible element whose
# class or id mentions geolocation.
- id: reference-geolocation-granted
  issue: "measurement-permissions"
  text: "the reference browser has geolocation granted; Ladybird (like Firefox) would ask"
  prefix: ["layout:", "mobile-layout:", "image-differs", "less-content", "more-content"]
  async: true
  js: |
    setTimeout(() => done(false), 5000);
    navigator.permissions.query({name: 'geolocation'}).then(p => {
      if (p.state !== 'granted') return done(false);
      const e = [...document.querySelectorAll('[class*=geoloc], [id*=geoloc], [class*=Geoloc], [id*=Geoloc]')]
        .find(x => { const r = x.getBoundingClientRect(); return r.width > 0 && r.height > 0; });
      done(e ? 'geolocation granted; ' + (e.id || String(e.className)).slice(0, 40) : false);
    }).catch(() => done(false));

# 2026-11-26: a race in the page, not a Ladybird bug. CookieYes replaces YouTube iframes with a "accept cookies"
# placeholder (a 1080×608 div) only when they are inserted after its script runs, so how many are replaced depends on
# load timing: on a Divi site Ladybird had 4 placeholders, Firefox 2 and an iframe, Chromium none (the video box 795 px
# high against 187). Runs in Ladybird: a visible CookieYes video placeholder.
- id: cookieyes-video-placeholder
  issue: "not-a-bug:cookieyes-placeholder-race"
  text: "CookieYes replaced an embedded video with its consent placeholder (depends on load timing; Firefox too)"
  prefix: ["layout:", "mobile-layout:", "image-differs", "less-content", "more-content", "shorter-page"]
  run_in: ladybird
  js: |
    const e = [...document.querySelectorAll('[data-cky-tag=video-placeholder]')]
      .find(x => { const r = x.getBoundingClientRect(); return r.width > 50 && r.height > 50; });
    return e ? 'CookieYes video placeholder ' + Math.round(e.getBoundingClientRect().height) + ' px' : false;

# 2026-11-26: a measurement artefact in the reference's fonts. With a font stack naming "PingFang SC" / "Microsoft
# YaHei" after Latin web fonts (a Chinese e-commerce page), Chromium draws Han characters about 5 px wide at 14 px –
# a substitute without CJK glyphs – where Ladybird (10.5 px) and Firefox (13 px) use a CJK font, so a paragraph is two
# lines in Chromium and four in Ladybird. Runs in the reference browser: a visible element with Han, kana or Hangul text
# whose font draws four such characters narrower than two ems.
- id: reference-narrow-cjk-fallback
  issue: "measurement-fonts"
  text: "the reference browser draws CJK characters with a narrow substitute font (no CJK glyphs for the page's font stack)"
  prefix: ["layout:", "mobile-layout:", "image-differs", "shorter-page", "overflow", "mobile-overflow", "less-content"]
  js: |
    const CJK = /[぀-ヿ㐀-鿿가-힯]{4}/;
    const c = document.createElement('canvas').getContext('2d');
    const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT); let n, seen = 0;
    while ((n = w.nextNode()) && seen < 200) {
      const m = n.data.match(CJK); if (!m) continue; seen++;
      const e = n.parentElement, r = e.getBoundingClientRect(); if (r.width < 1 || r.height < 1) continue;
      const s = getComputedStyle(e); c.font = s.font || (s.fontSize + ' ' + s.fontFamily);
      const fs = parseFloat(s.fontSize);
      if (c.measureText(m[0]).width < 2 * fs) return 'CJK at ' + (c.measureText(m[0]).width / 4).toFixed(1) + ' px per character, font ' + s.fontFamily.slice(0, 50);
    }
    return false;
